<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create itinerary — GlobeTrotter</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Create Your Itinerary</h1>
      <p>Pick Bamenda places, save them in one plan, and keep your visit organized.</p>
      <a class="text-link" href="/">Back to home</a>
    </header>

    <main>
      <section class="card">
        <form id="itinerary-form" class="auth-form">
          <label>Itinerary title<input type="text" id="itinerary-title" required /></label>
          <label>Selected places<input type="text" id="itinerary-destination-ids" readonly /></label>
          <div id="itinerary-selection" class="selection-list"></div>
          <label>Start date<input type="date" id="itinerary-start" /></label>
          <label>End date<input type="date" id="itinerary-end" /></label>
          <label>Budget (XAF)<input type="number" id="itinerary-budget" min="0" step="0.01" placeholder="Francs" /></label>
          <label>Notes<textarea id="itinerary-notes"></textarea></label>
          <div class="form-actions">
            <button type="submit">Save itinerary</button>
            <button type="button" id="share-itinerary-button">Share itinerary</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>Choose more Bamenda places</h2>
          <p>Search and add destinations to your own itinerary from one page.</p>
        </div>
        <form id="destination-search-form" class="auth-form search-inline">
          <input type="text" id="destination-search" placeholder="Search by name or place" />
          <button type="submit">Search</button>
        </form>
        <div id="destination-picker" class="list"></div>
      </section>

      <section class="card map-card">
        <h2>Selected itinerary map</h2>
        <div id="map" class="map"></div>
      </section>
    </main>

    <section id="messages" class="notifications"></section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="itinerary.js"></script>
</body>
</html>
